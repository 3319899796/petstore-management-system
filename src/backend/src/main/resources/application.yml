server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: pet-store
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地库：先在 MySQL 里执行 src/db/schema.sql 建库建表
    url: jdbc:mysql://127.0.0.1:3306/pet_store?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    # 本机 MySQL 密码；不想写死在文件里就设环境变量 MYSQL_PASSWORD
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  servlet:
    multipart:
      # 宠物照片上传上限（只存路径，限制大小防滥用）
      max-file-size: 5MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印真实 SQL，写论文截图也用得上；上线可换成 org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  upload:
    # 宠物照片落盘目录（Windows 用正斜杠即可）；不存在会自动创建
    dir: D:/论文毕设/upload
    # 浏览器访问前缀，与 WebConfig 的 /files/** 映射对应
    url-prefix: /files
  jwt:
    # HS256 要求密钥 ≥ 32 字节
    secret: pet-store-jwt-secret-2027-ningcong-graduation-design
    # 令牌有效期（秒）：2 小时
    expire-seconds: 7200

logging:
  level:
    com.ningcong.petstore: debug
